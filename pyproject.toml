[tool.poetry]
name = "FastapiAuthService"
version = "0.1.0"



[tool.poetry.dependencies]
python = "^3.12"
asyncpg = "^0.29.0"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = "^2.0"
python-dotenv = "^1.0.1"
aiogram = "3.22.0"

itsdangerous = "^2.2.0"
python-multipart = "^0.0.9"
pydantic-settings = "^2.12.0"
alembic = "^1.17.2"
aiosqlite = "^0.21.0"
passlib = "^1.7.4"
argon2-cffi = "^25.1.0"
pyjwt = "^2.10.1"

[tool.poetry.group.dev.dependencies]
black = "^24.8"
flake8 = "^7.1"
ruff = "^0.6.0"




[tool.black]
line-length = 79
target-version = ['py312']
skip-string-normalization = true

[tool.ruff]
fix = true
line-length = 79

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.flake8]
max-line-length = 79
exclude = ["venv", ".venv", "build", "dist", "__pycache__"]
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = false
warn_unreachable = false
disable_error_code = ["attr-defined", "misc", "call-arg", "assignment"]

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
